set noparent
# cpplint treats <QFoo> as a C system header; Qt is "other library" here.
filter=-build/include_order
# Guards are CHESSBOARD_<DIR>_<FILE>_HPP_, not the path cpplint expects.
filter=-build/header_guard
# False positives on wrapped initializers.
filter=-whitespace/indent_namespace
filter=-whitespace/braces
