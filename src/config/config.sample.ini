; Sample ChessBoard configuration.

[engine]
; Path to a UCI-compatible chess engine executable. Either a bare command
; name resolved via PATH (e.g. "stockfish") or an absolute path.
path=stockfish

[engine/uci_options]
; User-set overrides for UCI options the engine advertises (e.g. Hash,
; Threads, Skill Level), applied via "setoption" each time the engine starts.
; Populated from the Settings dialog's Engine tab; empty by default.

; engine/strength_preset_0 .. engine/strength_preset_8 (top-level [engine]
; section, not shown here since they're set individually): target Elo for
; each of the 9 named "Playing strength" presets (weakest to strongest),
; sent as UCI_Elo when that preset is selected. Editable from the Engine
; tab; defaults span 1320-3190.

[board]
; Board pattern theme. One of: wood, metal, marble, glass
theme=wood
; Board color scheme (tint applied to the theme's texture). One of: brown, grey, green, blue, red
color_scheme=brown
; Piece glyph set. One of: stix_two_math, free_serif, nishiki_teki, noto_sans_symbols2, dejavusans
piece_set=stix_two_math

[newgame]
; Last-used New Game dialog selections, restored as its defaults next time it's opened.
; Side to play as. One of: black, random, white
side=random
minutes=30
increment_seconds=0
; Selected "Strength" button: 0-8 for one of the 9 named presets (weakest to
; strongest), or 9 for "Full strength" (the default).
strength_id=9
